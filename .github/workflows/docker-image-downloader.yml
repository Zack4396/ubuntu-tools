name: Docker Image Downloader (linux/amd64 only)

on:
  workflow_dispatch: # 手动触发

jobs:
  download-and-package:
    runs-on: ubuntu-latest

    steps:
    # 设置 Docker 默认架构为 linux/amd64
    - name: Set platform to linux/amd64
      run: |
        export DOCKER_CLI_PLATFORM=linux/amd64

    # 拉取镜像并保存
    - name: Pull Docker Image for linux/amd64
      run: |
        docker pull --platform linux/amd64 ubuntu:latest # 替换为需要的镜像
        docker save -o ubuntu-latest-linux-amd64.tar ubuntu:latest

    # 生成 MD5 校验和
    - name: Generate MD5 checksum
      run: |
        md5sum ubuntu-latest-linux-amd64.tar > ubuntu-latest-linux-amd64.tar.md5

    # 将打包的镜像和 MD5 校验文件保存为 Artifact
    - name: Upload Docker Image and MD5
      uses: actions/upload-artifact@v3
      with:
        name: ubuntu-latest-linux-amd64
        path: |
          ubuntu-latest-linux-amd64.tar
          ubuntu-latest-linux-amd64.tar.md5
